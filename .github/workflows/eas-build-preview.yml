name: EAS Build (Android Preview)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK via EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # EXPO_PUBLIC_FIREBASE_* variables are NOT read from GitHub Secrets here —
      # the actual native build runs on EAS's cloud infra, not this runner.
      # Configure them once as EAS environment variables instead:
      #   npx eas env:create --scope project --environment preview
      # or via https://expo.dev -> your project -> Environment variables
      - name: Build Android APK (preview profile)
        run: eas build --platform android --profile preview --non-interactive
