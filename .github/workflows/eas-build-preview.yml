name: Preview (Android APK + Web)

on:
  push:
    branches:
      - alpha-1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build Android APK via EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # EXPO_PUBLIC_FIREBASE_* ไม่ได้ส่งจากที่นี่ — การบิลด์ native รันบนเครื่องของ EAS
      # ไม่ใช่ runner ตัวนี้ ค่าจึงต้องอยู่ใน EAS environment "preview" (แหล่งเดียวกับที่
      # จ๊อบ web ดึงไปใช้ผ่าน eas env:exec ด้านล่าง — มีที่เดียวจะได้ไม่หลุดจากกัน)
      #   npx eas env:list preview
      #   npx eas env:set preview --scope project
      - name: Build Android APK (preview profile)
        id: build
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          apk_url=$(jq -r '.[0].artifacts.buildUrl // empty' build.json)
          build_id=$(jq -r '.[0].id // empty' build.json)
          echo "apk_url=$apk_url" >> "$GITHUB_OUTPUT"
          {
            echo "## 📱 Android preview build"
            echo ""
            echo "\`Commit: ${GITHUB_SHA}\`"
            echo ""
            if [ -n "$apk_url" ]; then
              # QR ถูก render โดย api.qrserver.com (บริการภายนอก) — สแกนแล้วโหลด APK ลงมือถือได้เลย
              # ถ้าไม่อยากส่ง URL ออกนอก GitHub ให้ลบสองบรรทัดล่างนี้ทิ้ง เหลือแค่ลิงก์ดาวน์โหลด
              qr_data=$(jq -rn --arg u "$apk_url" '$u|@uri')
              echo "<img src=\"https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=$qr_data\" width=\"220\" alt=\"QR ติดตั้ง APK\" />"
              echo ""
              echo "สแกน QR ด้วยมือถือ Android เพื่อติดตั้งได้ทันที หรือ [ดาวน์โหลด APK]($apk_url)"
            else
              echo "⚠️ ไม่พบ artifact URL จาก EAS"
            fi
            echo ""
            echo "- หน้า build บน expo.dev: https://expo.dev/accounts/devaflow/projects/myapp/builds/$build_id"
            echo "- ไฟล์ APK แนบไว้ที่ Artifacts ของ run นี้ด้วย"
            echo "- เช็กว่าตรงกับเว็บไหม: เปิดแอป → โปรไฟล์ → ตั้งค่าทั่วไป → \"เวอร์ชันของแอป\""
          } >> "$GITHUB_STEP_SUMMARY"

      # EAS เก็บไฟล์ไว้บนเซิร์ฟเวอร์ของ Expo — ดึงมาแนบกับ run เพื่อกดดาวน์โหลดได้จาก GitHub
      - name: Download APK from EAS
        if: steps.build.outputs.apk_url != ''
        run: curl -fL --retry 3 -o habittime-preview.apk "${{ steps.build.outputs.apk_url }}"

      - name: Upload APK artifact
        if: steps.build.outputs.apk_url != ''
        uses: actions/upload-artifact@v7
        with:
          name: habittime-preview-apk
          path: habittime-preview.apk
          if-no-files-found: error
          retention-days: 30

  web:
    name: Export web preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ต้องมี eas CLI เพื่อดึงค่า env จาก EAS ตอน export (ดูสเต็ปถัดไป)
      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ต่างจากจ๊อบ APK: การ export เว็บรันบน runner ตัวนี้เอง ไม่ได้ไปรันบน EAS
      # แต่ค่า EXPO_PUBLIC_* ต้องเป็นชุดเดียวกับที่ APK ใช้ — eas env:exec จึงดึงค่าจาก
      # EAS environment "preview" มาใส่ให้ตอนรัน (ส่งได้เฉพาะตัวที่ไม่ใช่ secret
      # ค่า Firebase web config ไม่ใช่ความลับอยู่แล้ว ดู .env.example)
      #
      # EXPO_BASE_URL: GitHub Pages เสิร์ฟที่ /<repo> ไม่ใช่ root — app.config.js
      # อ่านค่านี้ไปตั้ง experiments.baseUrl ให้ ไม่งั้น asset 404 ทั้งหน้า
      #
      # eas-cli 23+ รับชื่อ environment เป็น positional argument (ไม่มี --environment แล้ว)
      - name: Export static web build
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: eas env:exec preview 'npx expo export -p web --output-dir dist' --non-interactive

      # GitHub Pages เสิร์ฟไฟล์ตรง ๆ ไม่มี SPA fallback — ถ้าผู้ใช้กด refresh ค้างอยู่
      # ที่ route ย่อยที่ไม่มีไฟล์ .html ตรงกัน จะเจอหน้า 404 ของ GitHub แทนตัวแอป
      - name: Add SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-web:
    name: Deploy web preview to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add link to job summary
        run: |
          {
            echo "## 🌐 Web preview"
            echo ""
            echo "\`Commit: ${GITHUB_SHA}\`"
            echo ""
            echo "เปิดดูแอปในเบราว์เซอร์ได้เลย: ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "> โมดูล native (WatermelonDB / SecureStore / Notifications) อาจไม่ทำงานบนเว็บ — ใช้ดู UI/flow เป็นหลัก"
            echo ""
            echo "APK ของ run นี้สร้างจาก commit เดียวกัน — เทียบได้ที่ ตั้งค่าทั่วไป → \"เวอร์ชันของแอป\" ทั้งสองฝั่ง"
          } >> "$GITHUB_STEP_SUMMARY"
